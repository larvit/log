name: Push
on: [push]
# The jobs only read the repo, so a dependency's install script gets no write scope.
permissions:
  contents: read
jobs:
  Build-and-test:
    runs-on: ubuntu-26.04
    # The job name keeps the branch protection's required checks, "Build-and-test (18)" and so on,
    # stable while Renovate bumps an image's patch version.
    name: Build-and-test (${{ matrix.node }})
    strategy:
      matrix:
        include:
          - { node: "18", image: "node:18.20.8-bookworm-slim" }
          - { node: "20", image: "node:20.20.2-bookworm-slim" }
          - { node: "22", image: "node:22.23.4-bookworm-slim" }
          - { node: "24", image: "node:24.22.2-bookworm-slim" }
          - { node: "26", image: "node:26.13.0-bookworm-slim" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Deps + build + test all run inside the container, so this matches `npm run test-docker` locally.
      - name: Test (Node ${{ matrix.node }}, in Docker)
        run: npm run test-docker
        env:
          NODE_IMAGE: ${{ matrix.image }}

  Browser-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Same suite in real Chromium via the official Playwright Docker image.
      - run: npm run test-browser

  OTLP-test:
    runs-on: ubuntu-26.04
    # End-to-end check: export to a real (pinned) OpenTelemetry Collector and assert it parsed both
    # our JSON and protobuf output. index.js is built in Docker (deps in the container), so the host
    # needs only Docker plus Node to run the driver — no `npm ci`.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - run: npm run test-otlp

  Lint:
    runs-on: ubuntu-26.04
    # eslint 10 / eslint-plugin-perfectionist need Node 20+; lint is static, so run it once
    # here instead of inside every test-matrix node (Node 18 can't run the linter).
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - run: npm ci
      - run: npm run lint
